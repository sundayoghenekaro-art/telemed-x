name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
    - uses: actions/checkout@v4

    # Capacitor 8 / Gradle 8.14 require JDK 21; JDK 11 cannot run this build.
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    # The wrapper lives in android/, not at the repository root.
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --no-daemon
      env:
        GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g
