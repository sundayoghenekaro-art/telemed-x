    <script>
      // The auth client consumes and clears the recovery hash during start-up, so
      // record the link first. Links minted before /reset-password existed still
      // arrive at "/" (the Site URL fallback), so move them onto the right route.
      (function () {
        var hash = window.location.hash;
        if (hash.indexOf('type=recovery') === -1) return;
        try {
          window.sessionStorage.setItem('trika:password-recovery', '1');
        } catch (error) {
          // Private modes can refuse storage; the link is still single-use.
        }
        if (window.location.pathname !== '/reset-password') {
          window.history.replaceState(
            null,
            '',
            '/reset-password' + window.location.search + hash
          );
        }
      })();
    </script>
